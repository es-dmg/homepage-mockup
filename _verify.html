<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>v3 quicklink rows</title>
<style>body{font-family:monospace}iframe{border:1px solid #999;display:block;margin-bottom:6px;height:760px}pre{white-space:pre-wrap;background:#f5f5f5;padding:8px}</style>
</head>
<body>
<pre id="out">running…</pre>
<div id="frames"></div>
<script>
var WIDTHS=[1900,1440,1280,1100,1024,900,820];
var out=[];function log(s){out.push(s);document.getElementById('out').textContent=out.join('\n');}
var host=document.getElementById('frames');
var frames=WIDTHS.map(function(w){var f=document.createElement('iframe');f.src='v3.html';f.width=w;host.appendChild(f);return{w:w,f:f};});
function ready(f){return new Promise(function(r){if(f.contentDocument&&f.contentDocument.readyState==='complete')r();else f.addEventListener('load',function(){r();});});}
Promise.all(frames.map(function(o){return ready(o.f);})).then(function(){return new Promise(function(r){setTimeout(r,1400);});}).then(function(){
  frames.forEach(function(o){
    var d=o.f.contentDocument;
    var tops=[];
    d.querySelectorAll('.hero-quicklinks a, .hero-quicklinks .ql-label').forEach(function(a){
      var t=Math.round(a.getBoundingClientRect().top);
      if(!tops.some(function(x){return Math.abs(x-t)<6;}))tops.push(t);
    });
    var hs=d.documentElement.scrollWidth>o.w;
    log('w='+o.w+' quicklink rows='+tops.length+(tops.length<=2?' GOOD':tops.length===3?' ok':' TOO MANY')+' hscroll='+(hs?'FAIL':'ok'));
  });
  log('DONE');
});
</script>
</body>
</html>
