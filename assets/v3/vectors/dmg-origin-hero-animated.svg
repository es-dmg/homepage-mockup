<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="How the DMG logo was built">
  <title>How the DMG logo was built</title>
  <desc>Three focus-area circles resolve through a Venn diagram into the DMG mark. Type is Nunito Sans; install it or convert text to outlines before external use.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143F70"/>
      <stop offset="0.45" stop-color="#1A518E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="1200" fill="url(#bg)"/>
  <!-- Sequence (~6.6s, plays once, then the mark rests in place):
       1. three solid white circles FLY IN, each carrying its focus
          area, and settle into the Venn positions
       2. the line-only Venn outline fades in over the fills, then
          the figures appear overlaid, each hugging its own rim
       3. the fills dissolve to the line-only Venn while the three
          phrases hand off to the hero copy line as travelling
          ghost text (timed in v3.js); the figures turn white
       4. everything resolves into the mark, which stays. -->
  <!-- 1. white circles + labels fly in together -->
  <g transform="translate(0 -1500)">
    <animateTransform attributeName="transform" type="translate" from="0 -1500" to="0 0" begin="0.00s" dur="1.10s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <circle cx="600.000" cy="377.261" r="315.000" fill="#FFFFFF" opacity="0.62">
      <animate attributeName="opacity" from="0.62" to="0" begin="3.60s" dur="1.00s" fill="freeze"/>
    </circle>
    <g font-family="Nunito Sans, Nunito, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#1A518E" transform="translate(0 0)">
                      <animate attributeName="opacity" from="1" to="0" begin="3.60s" dur="0.50s" fill="freeze"/>
      <text x="600.00" y="240.00" font-size="40" font-weight="700" letter-spacing="1.9">STUDENT</text>
      <text x="600.00" y="292.00" font-size="40" font-weight="400" letter-spacing="1.9">OUTCOMES</text>
    </g>
  </g>
  <g transform="translate(1500 900)">
    <animateTransform attributeName="transform" type="translate" from="1500 900" to="0 0" begin="0.25s" dur="1.10s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <circle cx="792.897" cy="711.369" r="315.000" fill="#FFFFFF" opacity="0.62">
      <animate attributeName="opacity" from="0.62" to="0" begin="3.60s" dur="1.00s" fill="freeze"/>
    </circle>
    <g font-family="Nunito Sans, Nunito, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#1A518E" transform="translate(0 0)">
                      <animate attributeName="opacity" from="1" to="0" begin="3.90s" dur="0.50s" fill="freeze"/>
      <text x="886.00" y="796.00" font-size="40" font-weight="700" letter-spacing="1.9">OPERATIONAL</text>
      <text x="886.00" y="854.00" font-size="40" font-weight="400" letter-spacing="1.9">EFFICIENCY</text>
    </g>
  </g>
  <g transform="translate(-1500 900)">
    <animateTransform attributeName="transform" type="translate" from="-1500 900" to="0 0" begin="0.50s" dur="1.10s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <circle cx="407.103" cy="711.369" r="315.000" fill="#FFFFFF" opacity="0.62">
      <animate attributeName="opacity" from="0.62" to="0" begin="3.60s" dur="1.00s" fill="freeze"/>
    </circle>
    <g font-family="Nunito Sans, Nunito, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#1A518E" transform="translate(0 0)">
                      <animate attributeName="opacity" from="1" to="0" begin="4.20s" dur="0.50s" fill="freeze"/>
      <text x="314.00" y="796.00" font-size="40" font-weight="700" letter-spacing="1.9">RESOURCE</text>
      <text x="314.00" y="854.00" font-size="40" font-weight="400" letter-spacing="1.9">ALLOCATION</text>
    </g>
  </g>
  <!-- 3. the line-only Venn the fills dissolve into -->
  <g fill="none" stroke="#2DB9E1" stroke-width="7" opacity="0">
    <animate attributeName="opacity" from="0" to="0.75" begin="1.90s" dur="0.80s" fill="freeze"/>
    <animate attributeName="opacity" from="0.75" to="0" begin="5.80s" dur="1.20s" fill="freeze"/>
    <circle cx="600.000" cy="377.261" r="315.000"/>
    <circle cx="792.897" cy="711.369" r="315.000"/>
    <circle cx="407.103" cy="711.369" r="315.000"/>
  </g>
  <!-- 4. the overlap fills Light Blue, then morphs to the flatter logo triangle -->
  <path d="M -2.481 -135.718 A 4.000 4.000 0 0 1 2.481 -135.718 A 315.000 315.000 0 0 1 118.776 65.711 A 4.000 4.000 0 0 1 116.295 70.008 A 315.000 315.000 0 0 1 -116.295 70.008 A 4.000 4.000 0 0 1 -118.776 65.711 A 315.000 315.000 0 0 1 -2.481 -135.718 Z" transform="translate(600.0 600.0)" fill="#2DB9E1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.80s" dur="0.60s" fill="freeze"/>
    <animate attributeName="d" from="M -2.481 -135.718 A 4.000 4.000 0 0 1 2.481 -135.718 A 315.000 315.000 0 0 1 118.776 65.711 A 4.000 4.000 0 0 1 116.295 70.008 A 315.000 315.000 0 0 1 -116.295 70.008 A 4.000 4.000 0 0 1 -118.776 65.711 A 315.000 315.000 0 0 1 -2.481 -135.718 Z" to="M -4.300 -93.967 A 5.846 5.846 0 0 1 4.300 -93.967 A 361.880 361.880 0 0 1 83.528 43.259 A 5.846 5.846 0 0 1 79.227 50.708 A 361.880 361.880 0 0 1 -79.227 50.708 A 5.846 5.846 0 0 1 -83.528 43.259 A 361.880 361.880 0 0 1 -4.300 -93.967 Z" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </path>
  <!-- 2. the figures, overlaid on their own rims. Light Blue while the
       fills are white (they straddle fill and dark ground), then white
       as the ground returns -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.60s" dur="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <path d="M 373.410 158.440 A 315.000 315.000 0 0 1 826.590 158.440" fill="none" stroke="#2DB9E1" stroke-width="52.000" stroke-linecap="round">
      <animate attributeName="stroke" from="#2DB9E1" to="#FFFFFF" begin="3.60s" dur="1.20s" fill="freeze"/>
      <animate attributeName="d" from="M 373.410 158.440 A 315.000 315.000 0 0 1 826.590 158.440" to="M 477.712 481.908 A 170.000 170.000 0 0 1 722.288 481.908" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="stroke-width" from="52.000" to="36.550" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </path>
    <circle cx="600.000" cy="62.261" r="52.000" fill="#2DB9E1">
      <animate attributeName="fill" from="#2DB9E1" to="#FFFFFF" begin="3.60s" dur="1.20s" fill="freeze"/>
      <animate attributeName="cy" from="62.261" to="430.000" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="r" from="52.000" to="39.950" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.80s" dur="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <path d="M 1095.700 624.540 A 315.000 315.000 0 0 1 869.100 1017.010" fill="none" stroke="#2DB9E1" stroke-width="52.000" stroke-linecap="round">
      <animate attributeName="stroke" from="#2DB9E1" to="#FFFFFF" begin="3.60s" dur="1.20s" fill="freeze"/>
      <animate attributeName="d" from="M 1095.700 624.540 A 315.000 315.000 0 0 1 869.100 1017.010" to="M 763.414 553.142 A 170.000 170.000 0 0 1 641.126 764.950" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="stroke-width" from="52.000" to="36.550" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </path>
    <circle cx="1065.700" cy="868.870" r="52.000" fill="#2DB9E1">
      <animate attributeName="fill" from="#2DB9E1" to="#FFFFFF" begin="3.60s" dur="1.20s" fill="freeze"/>
      <animate attributeName="cx" from="1065.700" to="747.224" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="cy" from="868.870" to="685.000" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="r" from="52.000" to="39.950" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.00s" dur="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <path d="M 330.900 1017.010 A 315.000 315.000 0 0 1 104.300 624.540" fill="none" stroke="#2DB9E1" stroke-width="52.000" stroke-linecap="round">
      <animate attributeName="stroke" from="#2DB9E1" to="#FFFFFF" begin="3.60s" dur="1.20s" fill="freeze"/>
      <animate attributeName="d" from="M 330.900 1017.010 A 315.000 315.000 0 0 1 104.300 624.540" to="M 558.874 764.950 A 170.000 170.000 0 0 1 436.586 553.142" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="stroke-width" from="52.000" to="36.550" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </path>
    <circle cx="134.300" cy="868.870" r="52.000" fill="#2DB9E1">
      <animate attributeName="fill" from="#2DB9E1" to="#FFFFFF" begin="3.60s" dur="1.20s" fill="freeze"/>
      <animate attributeName="cx" from="134.300" to="452.776" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="cy" from="868.870" to="685.000" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="r" from="52.000" to="39.950" begin="5.40s" dur="1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </circle>
  </g>
</svg>